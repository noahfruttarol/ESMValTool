---
# Filename
filename: 'AOD_Level20_Monthly_V3.tar.gz'

# Common global attributes for Cmorizer output
attributes:
  dataset_id: AERONET
  version: 20250726
  tier: 3
  type: ground
  project_id: OBS6
  source: 'https://aeronet.gsfc.nasa.gov/new_web/download_all_v3_aod.html'
  reference: 'aeronetv3'
  comment:
    'Notice to users: this data has recommended guidelines for use and publication,
    please refer to https://aeronet.gsfc.nasa.gov/new_web/data_usage.html.'

  interpolation_method: log # Interpolation method for AOD data. Options: 'linear', 'log'

# Variables to cmorize
variables:
  od440aer:
    mip: AERmon
    wavelength: 440
  od550aer:
    mip: AERmon
    wavelength: 550
  od870aer:
    mip: AERmon
    wavelength: 870
  ae:
    mip: Custom
    raw_name: 440-870_Angstrom_Exponent
