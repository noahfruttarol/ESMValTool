---
# Common global attributes for Cmorizer output
attributes:
  dataset_id: GLODAP
  version: 'v2.2016b'
  tier: 2
  type: clim
  project_id: OBS6
  source: 'https://www.ncei.noaa.gov/data/oceans/ncei/ocads/data/0162565/mapped/GLODAPv2.2016b_MappedClimatologies.tar.gz'
  reference: 'glodap'
  comment: ''

# Variables to cmorize (here use only filename prefix)
# pHtsinsitutp: seawater ph reported on total scale at in situ temperature and pressure
variables:
  dissic:
    mip: Oyr
    raw_var: TCO2
    file: GLODAPv2.2016b
  talk:
    mip: Oyr
    raw_var: TAlk
    file: GLODAPv2.2016b
  ph:
    mip: Oyr
    raw_var: pHtsinsitutp
    file: GLODAPv2.2016b
  no3:
    mip: Oyr
    raw_var: NO3
    file: GLODAPv2.2016b
    raw_units: '1e-6 mol kg-1'
    comment: "The original units of this variable are umol/kg. To convert to the CMOR units mol/m3, we assume a constant sea water density of 1028 kg/m3, which is approximately the sea water density for T=4°C, salinity=35PSU, and p=0bar according to the UNESCO formula (UNESCO, 1981, Tenth report of the joint panel on oceanographic tables and standards, UNESCO Technical Papers in Marine Science, see https://www.wkcgroup.com/tools-room/seawater-density-calculator/ and https://link.springer.com/content/pdf/bbm:978-3-319-18908-6/1.pdf)."
  o2:
    mip: Oyr
    raw_var: oxygen
    file: GLODAPv2.2016b
    raw_units: '1e-6 mol kg-1'
    comment: "The original units of this variable are umol/kg. To convert to the CMOR units mol/m3, we assume a constant sea water density of 1028 kg/m3, which is approximately the sea water density for T=4°C, salinity=35PSU, and p=0bar according to the UNESCO formula (UNESCO, 1981, Tenth report of the joint panel on oceanographic tables and standards, UNESCO Technical Papers in Marine Science, see https://www.wkcgroup.com/tools-room/seawater-density-calculator/ and https://link.springer.com/content/pdf/bbm:978-3-319-18908-6/1.pdf)."

# Custom dictionary for this cmorizer
custom:
  reference_year: 2000
