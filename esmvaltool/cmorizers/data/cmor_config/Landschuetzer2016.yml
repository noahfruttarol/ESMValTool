  reference: 'landschuetzer2016'
  comment: ''

# Variables to cmorize
variables:
  fgco2:
    mip: Omon
    # Match CMOR variables with input file one
    raw: fgco2_clim
    # input file name
    file: SOM-FFN_v2023_CLIM_NCEI_OCADS.nc
  spco2:
    mip: Omon
    raw: spco2_clim
    file: SOM-FFN_v2023_CLIM_NCEI_OCADS.nc
